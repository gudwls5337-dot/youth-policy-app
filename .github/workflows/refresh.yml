# 주 1회 데이터 갱신 → 검증 → 배포
#
# 지속성 설계
#  · 검증이 깨지면 커밋하지 않는다. 틀린 데이터가 공개되는 것보다 낡은 게 낫다.
#  · 원본 스냅샷은 최근 8개만 남긴다. 매주 8MB 를 쌓으면 1년에 400MB 가 된다.
#  · 변경이 없으면 커밋하지 않는다.
#
# 필요한 설정: 저장소 Settings > Secrets > Actions 에 ONTONG_POLICY_API_KEY 추가

name: refresh
on:
  schedule:
    - cron: "0 20 * * 0"      # 매주 월요일 05:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install

      - name: .env 구성
        env:
          KEY: ${{ secrets.ONTONG_POLICY_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ONTONG_POLICY_API_KEY 시크릿이 없습니다. Settings > Secrets > Actions 에 추가하세요."
            exit 1
          fi
          {
            echo "ONTONG_POLICY_API_KEY=$KEY"
            echo "ONTONG_SPACE_API_KEY="
            echo "LAW_GO_KR_OC=test"
            echo "SNAPSHOT_DATE=$(date -u -d '+9 hours' +%F)"
            echo "REQUEST_DELAY_MS=300"
          } > .env

      - name: 조례 수집 (법제처 · 키 불필요)
        run: |
          node scripts/snapshot-ordinances.mjs
          node scripts/extract-definitions.mjs

      - name: 정책 수집 (온통청년)
        run: node scripts/snapshot-policies.mjs

      # 양산은 시 공식 채널이라 「현황」의 정본이다. 실패하면 멈춘다 —
      # 낡은 양산 데이터로 「시행중」을 말하느니 갱신을 거르는 게 낫다.
      - name: 양산 수집 (청년가까e · 키 불필요)
        run: |
          node scripts/collect-yangsan.mjs
          node scripts/collect-yangsan-ordinances.mjs
          node scripts/build-yangsan.mjs

      # 지난 제안 처리결과는 공문 PDF 라 저장소 밖에 있다. 원자료가 없으면
      # 기존 docs/data/proposals.json 을 그대로 둔다 — 빌드는 그것만 있으면 된다.
      - name: 지난 제안 (원자료 있을 때만)
        continue-on-error: true
        run: |
          if [ -d "../정책단projects/yangsan-policy/sources/제안서" ]; then
            node scripts/collect-proposals.mjs && node scripts/build-proposals.mjs
          else
            echo "공문 원자료 없음 — 기존 proposals.json 유지"
          fi

      - name: 무엇이 바뀌었나
        run: node scripts/whats-new.mjs

      - name: 빌드
        run: npm run build

      - name: 검증 — 깨지면 여기서 멈춘다
        run: |
          node scripts/validate.mjs
          node scripts/smoke.mjs

      - name: 스냅샷 정리 — 최근 8개만 유지
        run: |
          for pat in '청년자치법규_전수' '청년정책_전수'; do
            ls -1 data/*"$pat"*.json 2>/dev/null | sort | head -n -8 | while read -r f; do
              echo "삭제: $f"; git rm -q --ignore-unmatch "$f" 2>/dev/null || rm -f "$f"
            done
          done

      - name: 커밋 · 배포
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .env
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u -d '+9 hours' +%F)

          자동 수집 · 검증 통과분만 반영.

          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>"
            git push
          fi

      # 알림은 **커밋 뒤**에 보낸다. 검증에서 멈추면 알림도 안 간다 —
      # 틀린 데이터를 알리는 것보다 아무 말 안 하는 게 낫다.
      - name: Slack 알림
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿 없음 — 알림 생략"
            exit 0
          fi
          node scripts/whats-new.mjs --slack-json > /tmp/slack.json
          curl -sS -X POST -H "Content-Type: application/json"                --data @/tmp/slack.json "$SLACK_WEBHOOK_URL"
          echo "Slack 알림 전송"
